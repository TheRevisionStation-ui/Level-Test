<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FREE Level Test – The Revision Station</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--teal:#00C5C8;--teal-dark:#00a0a3;--purple:#9B6FD4;--purple-light:#c4a0f0;--yellow:#FFD93D;--coral:#FF6B6B;--white:#FFFFFF;--dark:#1a1a2e;--shadow:4px 4px 0px #1a1a2e;--shadow-lg:6px 6px 0px #1a1a2e;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background-color:var(--teal);background-image:radial-gradient(circle at 10% 20%,rgba(255,255,255,0.15) 0%,transparent 40%),radial-gradient(circle at 90% 80%,rgba(155,111,212,0.2) 0%,transparent 40%);min-height:100vh;padding:8px;display:flex;flex-direction:column;align-items:center;}
  .floaties{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:0;}
  .floaty{position:absolute;font-size:2rem;opacity:0.12;animation:float 6s ease-in-out infinite;}
  .floaty:nth-child(1){top:5%;left:3%;animation-delay:0s}.floaty:nth-child(2){top:15%;right:5%;animation-delay:1s}.floaty:nth-child(3){top:50%;left:2%;animation-delay:2s}.floaty:nth-child(4){top:70%;right:3%;animation-delay:0.5s}.floaty:nth-child(5){top:85%;left:8%;animation-delay:1.5s}.floaty:nth-child(6){top:35%;right:2%;animation-delay:3s}
  @keyframes float{0%,100%{transform:translateY(0px) rotate(0deg)}50%{transform:translateY(-15px) rotate(5deg)}}
  .container{width:100%;max-width:720px;position:relative;z-index:1;}
  .header{text-align:center;margin-bottom:8px;animation:slideDown 0.6s ease-out;}
  @keyframes slideDown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
  .logo-img{width:70px;height:70px;object-fit:contain;filter:drop-shadow(3px 3px 0px rgba(0,0,0,0.3));margin-bottom:3px;}
  .header h1{font-family:'Fredoka One',cursive;font-size:clamp(1.6rem,6vw,3rem);color:var(--white);text-shadow:3px 3px 0px var(--dark);line-height:1.1;}
  .header p{color:var(--dark);font-size:0.95rem;font-weight:700;margin-top:8px;background:var(--yellow);display:inline-block;padding:4px 14px;border-radius:20px;border:2px solid var(--dark);}
  .progress-wrap{background:var(--white);border:3px solid var(--dark);border-radius:50px;padding:6px;margin-bottom:16px;box-shadow:var(--shadow);display:none;}
  .progress-bar{height:18px;background:linear-gradient(90deg,var(--purple),var(--teal-dark));border-radius:50px;transition:width 0.4s ease;min-width:18px;}
  .progress-label{text-align:center;font-weight:800;font-size:0.85rem;color:var(--dark);margin-top:4px;}
  .card{background:var(--white);border:3px solid var(--dark);border-radius:20px;padding:clamp(16px,4vw,28px);box-shadow:var(--shadow-lg);animation:fadeUp 0.4s ease-out;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .start-screen{text-align:center;}
  .start-screen h2{font-family:'Fredoka One',cursive;font-size:clamp(1.4rem,4vw,2rem);color:var(--dark);margin-bottom:10px;}
  .start-screen p{color:#555;font-size:clamp(0.85rem,2.5vw,1rem);line-height:1.6;margin-bottom:8px;}
  .level-badges{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0;}
  .badge{font-family:'Fredoka One',cursive;font-size:0.9rem;padding:6px 14px;border-radius:50px;border:2px solid var(--dark);font-weight:900;}
  .badge.a1{background:#b8f0b8}.badge.a2{background:#fffaaa}.badge.b1{background:#ffd6a5}.badge.b2{background:#ffb3c6}.badge.c1{background:var(--purple-light)}.badge.c2{background:#a0d4ff}
  .q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:6px;}
  .q-number{font-family:'Fredoka One',cursive;font-size:0.95rem;color:var(--purple);background:#f0e8ff;padding:4px 14px;border-radius:20px;border:2px solid var(--purple);}
  .q-level-tag{font-size:0.8rem;font-weight:800;padding:4px 12px;border-radius:20px;border:2px solid var(--dark);}
  .question-text{font-family:'Fredoka One',cursive;font-size:clamp(1rem,3.5vw,1.3rem);color:var(--dark);margin-bottom:20px;line-height:1.5;}
  .blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--dark);background:#fff3cd;border-radius:4px;padding:0 6px;color:var(--dark);font-style:italic;font-weight:800;}
  .options{display:grid;grid-template-columns:1fr;gap:8px;}
  @media(min-width:480px){.options{grid-template-columns:1fr 1fr;}}
  .option-btn{background:var(--white);border:3px solid var(--dark);border-radius:12px;padding:clamp(10px,2.5vw,12px) clamp(10px,2.5vw,14px);font-family:'Nunito',sans-serif;font-size:clamp(0.85rem,2.5vw,0.95rem);font-weight:700;cursor:pointer;transition:all 0.15s ease;box-shadow:3px 3px 0px var(--dark);text-align:left;color:var(--dark);width:100%;touch-action:manipulation;}
  .option-btn:hover:not(:disabled){background:#f0e8ff;transform:translate(-1px,-1px);box-shadow:4px 4px 0px var(--dark);}
  .option-btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0px var(--dark);}
  .option-btn.correct{background:#b8f0b8;border-color:#2d8a2d;box-shadow:3px 3px 0px #2d8a2d;}
  .option-btn.wrong{background:#ffd6d6;border-color:#c0392b;box-shadow:3px 3px 0px #c0392b;}
  .option-btn.reveal{background:#b8f0b8;border-color:#2d8a2d;box-shadow:3px 3px 0px #2d8a2d;}
  .option-btn:disabled{cursor:default;}
  .feedback-box{margin-top:16px;padding:12px 16px;border-radius:12px;font-weight:700;font-size:clamp(0.85rem,2.5vw,0.95rem);border:2px solid var(--dark);display:none;}
  .feedback-box.show{display:block;animation:fadeUp 0.3s ease;}
  .feedback-box.correct-fb{background:#b8f0b8;}
  .feedback-box.wrong-fb{background:#ffd6d6;}
  .next-btn{margin-top:16px;width:100%;padding:clamp(12px,3vw,14px);font-family:'Fredoka One',cursive;font-size:clamp(1rem,3vw,1.2rem);background:var(--purple);color:var(--white);border:3px solid var(--dark);border-radius:14px;cursor:pointer;box-shadow:var(--shadow);transition:all 0.15s ease;display:none;touch-action:manipulation;}
  .next-btn:hover{background:#7f55c0;transform:translate(-1px,-1px);box-shadow:var(--shadow-lg);}
  .next-btn.show{display:block;animation:fadeUp 0.3s ease;}
  .cta-btn{display:inline-block;padding:clamp(12px,3vw,16px) clamp(24px,6vw,40px);font-family:'Fredoka One',cursive;font-size:clamp(1.1rem,4vw,1.4rem);background:var(--yellow);color:var(--dark);border:3px solid var(--dark);border-radius:50px;cursor:pointer;box-shadow:var(--shadow-lg);transition:all 0.15s ease;text-decoration:none;margin-top:16px;touch-action:manipulation;}
  .cta-btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0px var(--dark);}
  .results-screen{text-align:center;}
  .result-level{font-family:'Fredoka One',cursive;font-size:clamp(3rem,12vw,5rem);line-height:1;margin:16px 0 8px;}
  .result-name{font-family:'Fredoka One',cursive;font-size:clamp(1.2rem,4vw,1.8rem);color:var(--dark);margin-bottom:12px;}
  .score-pill{display:inline-block;background:var(--yellow);border:3px solid var(--dark);border-radius:50px;padding:8px 24px;font-family:'Fredoka One',cursive;font-size:clamp(1rem,3vw,1.2rem);box-shadow:var(--shadow);margin-bottom:8px;}
  .result-desc{background:#f8f4ff;border:2px solid var(--purple-light);border-radius:14px;padding:16px;font-size:clamp(0.85rem,2.5vw,1rem);line-height:1.6;color:#444;margin-bottom:20px;text-align:left;}
  .guide-rec{background:var(--teal);border:3px solid var(--dark);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:20px;}
  .guide-rec h3{font-family:'Fredoka One',cursive;font-size:clamp(1rem,3vw,1.3rem);color:var(--dark);margin-bottom:6px;}
  .guide-rec p{font-size:clamp(0.85rem,2.5vw,0.95rem);font-weight:700;color:var(--dark);}
  .breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;text-align:center;}
  @media(max-width:400px){.breakdown{grid-template-columns:repeat(2,1fr);}}
  .breakdown-cell{background:var(--white);border:2px solid var(--dark);border-radius:12px;padding:10px 6px;}
  .breakdown-cell .blabel{font-size:0.7rem;font-weight:800;color:#888;text-transform:uppercase;letter-spacing:0.5px;}
  .breakdown-cell .bval{font-family:'Fredoka One',cursive;font-size:clamp(1rem,3vw,1.3rem);color:var(--dark);}
  .retry-btn{background:none;border:none;color:var(--dark);font-weight:800;font-size:0.9rem;cursor:pointer;text-decoration:underline;margin-top:12px;font-family:'Nunito',sans-serif;touch-action:manipulation;}
</style>
</head>
<body>
<div class="floaties"><div class="floaty">📚</div><div class="floaty">✏️</div><div class="floaty">🦉</div><div class="floaty">⭐</div><div class="floaty">📝</div><div class="floaty">🎓</div></div>
<div class="container">
  <div class="header">
    <img src="https://therevisionstation.com/assets/images/owl-logo.png" class="logo-img" alt="The Revision Station" onerror="this.style.display='none'">
    <h1>FREE Level Test</h1>
    <p>Find your English grammar level in minutes!</p>
  </div>
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar" style="width:3%"></div>
    <div class="progress-label" id="progressLabel">Question 1</div>

  <div class="card" id="mainCard"></div>
</div>
<script>
// ── QUESTION BANK — 50 per level ─────────────────────────────────────────────
const QB = {
A1:[
  {q:"What ___ your name?",opts:["is","are","am","be"],ans:0,exp:"We use 'is' with he/she/it and in questions with 'what'."},
  {q:"She ___ a teacher.",opts:["is","are","am","be"],ans:0,exp:"'Is' is used with she/he/it in the present simple."},
  {q:"I have ___ apple.",opts:["a","an","the","–"],ans:1,exp:"We use 'an' before words starting with a vowel sound."},
  {q:"They ___ from Spain.",opts:["is","are","am","be"],ans:1,exp:"'Are' is used with they/we/you."},

  {q:"I ___ hungry. Can I have some food?",opts:["is","are","am","be"],ans:2,exp:"'Am' is always used with 'I'."},
  {q:"There ___ a cat in the garden.",opts:["is","are","am","have"],ans:0,exp:"'There is' is used with singular nouns."},

  {q:"My name ___ Sarah.",opts:["is","are","am","be"],ans:0,exp:"'Is' is used with names and he/she/it."},
  {q:"___ your parents at home?",opts:["Is","Are","Am","Be"],ans:1,exp:"'Are' is used with plural nouns."},
  {q:"I ___ not tired today.",opts:["am","is","are","be"],ans:0,exp:"'Am' is used with 'I' in all present simple forms."},

  {q:"He is ___ old man.",opts:["a","an","the","–"],ans:1,exp:"'An' is used before vowel sounds — 'old' begins with a vowel sound."},
  {q:"There ___ three chairs in the room.",opts:["is","are","am","be"],ans:1,exp:"'There are' is used with plural nouns."},

  {q:"The cat is ___ the chair.",opts:["on","in","of","at"],ans:0,exp:"'On' shows position on top of a surface."},
  {q:"He ___ a red car.",opts:["have","has","is","are"],ans:1,exp:"'Has' is used with he/she/it."},
  {q:"___ you speak English?",opts:["Are","Do","Does","Is"],ans:1,exp:"'Do' forms questions with I/you/we/they."},
  {q:"I ___ to school every day.",opts:["go","goes","am go","going"],ans:0,exp:"Present simple uses the base form with I/you/we/they."},
  {q:"She ___ a sister.",opts:["have","has","is","are"],ans:1,exp:"'Has' is used with he/she/it for possession."},
  {q:"The children ___ happy.",opts:["is","am","are","be"],ans:2,exp:"'Are' is used with plural nouns."},
  {q:"I can ___ English.",opts:["speak","speaks","speaking","spoke"],ans:0,exp:"After modal verbs like 'can', use the base infinitive."},
  {q:"___ is that man? He is my teacher.",opts:["Who","What","Which","Where"],ans:0,exp:"'Who' asks about a person."},
  {q:"She lives ___ London.",opts:["in","at","on","to"],ans:0,exp:"'In' is used with cities and countries."},
  {q:"I get up ___ seven o'clock.",opts:["in","on","at","by"],ans:2,exp:"'At' is used with specific times."},
  {q:"He ___ not like coffee.",opts:["do","does","is","are"],ans:1,exp:"'Does not' is used for he/she/it in present simple negatives."},
  {q:"We ___ a big family.",opts:["has","have","is","are"],ans:1,exp:"'Have' is used with I/you/we/they."},
  {q:"___ is your phone number?",opts:["Who","What","Where","Which"],ans:1,exp:"'What' asks for information or a number."},
  {q:"She is ___ years old.",opts:["twenty","twentieth","twenty's","twenties"],ans:0,exp:"We use cardinal numbers (twenty) to state age."},
  {q:"I drink ___ water every day.",opts:["a","an","the","–"],ans:3,exp:"No article is used with uncountable nouns in a general sense."},
  {q:"They ___ students at this school.",opts:["is","am","are","be"],ans:2,exp:"'Are' is used with they."},
  {q:"He works ___ a doctor.",opts:["like","as","for","of"],ans:1,exp:"'Work as' describes a job or role."},
  {q:"___ is your favourite colour?",opts:["Who","Where","What","Which"],ans:2,exp:"'What' asks for a choice or description."},
  {q:"I ___ two brothers and one sister.",opts:["am","is","have","has"],ans:2,exp:"'Have' is used for possession with I."},
  {q:"The book is ___ the table.",opts:["on","in","at","of"],ans:0,exp:"'On' shows something resting on a surface."},
  {q:"She ___ English very well.",opts:["speak","speaks","is speak","speaking"],ans:1,exp:"'Speaks' is used with he/she/it in present simple."},
  {q:"___ do you live? — I live in Manchester.",opts:["What","Who","Where","When"],ans:2,exp:"'Where' asks about location."},
  {q:"I like ___ chocolate.",opts:["a","an","the","–"],ans:3,exp:"No article is used with uncountable nouns when speaking generally."},
  {q:"He is ___ engineer.",opts:["a","an","the","–"],ans:1,exp:"'An' is used before vowel sounds — 'engineer' begins with a vowel sound."},
  {q:"___ you tired?",opts:["Is","Am","Are","Be"],ans:2,exp:"'Are' is used with 'you'."},
  {q:"We ___ not from France.",opts:["am","is","are","be"],ans:2,exp:"'Are' is used with 'we'."},
  {q:"I have ___ orange and ___ banana.",opts:["a / a","an / a","a / an","an / an"],ans:1,exp:"'An' before a vowel sound (orange), 'a' before a consonant sound (banana)."},
  {q:"___ many people are in the room?",opts:["How","What","Which","Who"],ans:0,exp:"'How many' asks about quantity of countable nouns."},
  {q:"She ___ not work on Sundays.",opts:["do","does","is","are"],ans:1,exp:"'Does not' is used for negatives with he/she/it."},
],
A2:[
  {q:"I ___ TV every evening.",opts:["watch","watches","am watching","watched"],ans:0,exp:"Present simple is used for habits and routines."},
  {q:"She ___ to school yesterday.",opts:["go","goes","went","has gone"],ans:2,exp:"Past simple is used for completed actions in the past."},
  {q:"___ you like coffee?",opts:["Are","Do","Does","Did"],ans:1,exp:"'Do' forms questions with I/you/we/they in present simple."},
  {q:"He is ___ than his brother.",opts:["tall","taller","tallest","more tall"],ans:1,exp:"Comparative adjectives use -er for short adjectives."},

  {q:"We ___ football every Saturday.",opts:["play","plays","played","are play"],ans:0,exp:"Present simple with we/they/I uses the base form."},
  {q:"___ she speak French?",opts:["Are","Do","Does","Did"],ans:2,exp:"'Does' is used for he/she/it in present simple questions."},
  {q:"That is ___ worst film I have ever seen.",opts:["a","an","the","–"],ans:2,exp:"'The' is used before superlatives."},
  {q:"I ___ tired, so I went to bed early.",opts:["was","were","am","be"],ans:0,exp:"'Was' is the past simple of 'am/is' for I/he/she/it."},
  {q:"He ___ in London for ten years.",opts:["live","lives","lived","is living"],ans:2,exp:"Past simple is used for a completed period of time in the past."},
  {q:"I ___ to the cinema last Saturday.",opts:["go","went","have gone","goes"],ans:1,exp:"Past simple describes a finished action in the past."},
  {q:"She is ___ beautiful than her photo.",opts:["more","most","much","very"],ans:0,exp:"'More' forms comparatives with longer adjectives."},
  {q:"I don't have ___ money left.",opts:["some","any","many","much"],ans:3,exp:"'Much' is used with uncountable nouns in negative sentences."},
  {q:"They ___ eating dinner when we arrived.",opts:["are","were","was","had"],ans:1,exp:"Past continuous: were + -ing form."},
  {q:"She ___ not come to the party last night.",opts:["did","does","was","had"],ans:0,exp:"'Did not' forms past simple negatives."},
  {q:"I am going to ___ a new car next year.",opts:["buy","buying","bought","buys"],ans:0,exp:"'Going to' is followed by the base infinitive."},
  {q:"He speaks English ___ than I do.",opts:["good","better","best","well"],ans:1,exp:"'Better' is the comparative of 'well' and 'good'."},
  {q:"We arrived ___ time for the train.",opts:["in","on","at","for"],ans:1,exp:"'On time' means not late — a fixed expression."},
  {q:"I usually ___ up at 7 o'clock.",opts:["wake","wakes","woke","am waking"],ans:0,exp:"Present simple uses the base form with I for habitual actions."},
  {q:"They didn't ___ to the meeting.",opts:["came","come","coming","comes"],ans:1,exp:"After 'didn't', use the base form of the verb."},
  {q:"___ you ever been to Paris?",opts:["Did","Have","Had","Were"],ans:1,exp:"'Have you ever been' uses the present perfect for life experience."},
  {q:"She has got ___ cats.",opts:["much","some","a","any"],ans:1,exp:"'Some' is used with countable plural nouns in positive sentences."},
  {q:"The test was ___ than I expected.",opts:["more hard","harder","hardest","most hard"],ans:1,exp:"Short adjectives use -er to form comparatives."},

  {q:"She was tired ___ she had worked all day.",opts:["so","because","but","although"],ans:1,exp:"'Because' introduces a reason."},
  {q:"___ long did the journey take?",opts:["What","How","Why","Where"],ans:1,exp:"'How long' asks about duration."},
  {q:"I need ___ help with this exercise.",opts:["a","an","some","any"],ans:2,exp:"'Some' is used with uncountable nouns in positive sentences."},

  {q:"They ___ to the park yesterday afternoon.",opts:["go","goes","went","gone"],ans:2,exp:"'Went' is the past simple of 'go'."},
  {q:"He is ___ the most popular student in class.",opts:["by far","much more","very","quite much"],ans:0,exp:"'By far' intensifies a superlative."},

  {q:"She was ___ happy when she heard the news.",opts:["so","such","very","too"],ans:0,exp:"'So' is used before adjectives; 'such' before noun phrases."},
  {q:"___ there a post office near here?",opts:["Is","Are","Has","Have"],ans:0,exp:"'Is there' asks about a single thing."},
  {q:"I have lived here ___ three years.",opts:["since","for","during","while"],ans:1,exp:"'For' is used with a period of time."},

  {q:"Can you ___ me a favour?",opts:["make","give","do","have"],ans:2,exp:"'Do someone a favour' is a fixed collocation."},
  {q:"I was ___ tired that I fell asleep on the bus.",opts:["so","such","very","too"],ans:0,exp:"'So + adjective' expresses a high degree."},

  {q:"Her argument was so ___ that few could find fault with it.",opts:["watertight","airtight","flawless","both A and B are correct"],ans:3,exp:"'Watertight' and 'airtight' are both idiomatic for an argument with no weaknesses."},
  {q:"The committee remained ___ in its decision despite protests.",opts:["resolute","steadfast","unwavering","all three are correct"],ans:3,exp:"'Resolute', 'steadfast' and 'unwavering' all mean determined and firm."},
  {q:"He spoke with great ___, choosing every word carefully.",opts:["circumspection","caution","care","deliberateness"],ans:0,exp:"'Circumspection' is the most precise formal word for careful, considered behaviour."},
  {q:"The author's prose has a ___ quality — brief, precise and elegant.",opts:["lapidary","concise","clean","polished"],ans:0,exp:"'Lapidary' describes writing that is brief and elegantly crafted."},
  {q:"The new regulation was met with widespread ___.",opts:["opprobrium","criticism","disapproval","all are correct"],ans:3,exp:"All are correct — 'opprobrium' is the most formal register choice."},
  {q:"He gave a ___ account of events, leaving nothing out.",opts:["exhaustive","thorough","comprehensive","all three are correct"],ans:3,exp:"'Exhaustive', 'thorough' and 'comprehensive' all describe a complete account."},
  {q:"The law was ___ to address the needs of modern technology.",opts:["ill-equipped","inadequate","outdated","not designed"],ans:0,exp:"'Ill-equipped' means poorly prepared or unsuitable for a purpose."},
  {q:"The policy was ___ out of step with public opinion.",opts:["wildly","completely","entirely","all three work"],ans:3,exp:"'Wildly/completely/entirely out of step' are all natural intensifiers."},
  {q:"She has a ___ for languages — she speaks six fluently.",opts:["gift","flair","talent","all three work"],ans:3,exp:"'Gift/flair/talent for' are all natural collocations."},
  {q:"The ruling ___ a significant precedent for future cases.",opts:["set","established","created","all three work"],ans:3,exp:"'Set/establish/create a precedent' are all correct collocations."},
  {q:"His account of events was ___ — it simply didn't add up.",opts:["implausible","unlikely","questionable","all three work"],ans:3,exp:"All three mean hard to believe, though with slightly different nuances."},
  {q:"The decision was taken ___ of the committee, without consultation.",opts:["outside","beyond","in spite","regardless"],ans:0,exp:"'Outside of' means without the knowledge or involvement of."},
  {q:"She has an ___ ability to put people at ease.",opts:["uncanny","extraordinary","remarkable","all three work"],ans:3,exp:"'Uncanny/extraordinary/remarkable' all describe an exceptional ability."},
  {q:"The argument is so well-constructed that it is virtually ___.",opts:["irrefutable","incontrovertible","unassailable","all three work"],ans:3,exp:"'Irrefutable', 'incontrovertible' and 'unassailable' all mean impossible to disprove."},
  {q:"He is known for his ___ wit — sharp, dry and perfectly timed.",opts:["sardonic","wry","acerbic","all three work"],ans:3,exp:"'Sardonic', 'wry' and 'acerbic' all describe sharp, dry humour."},
  {q:"The situation has become ___ untenable.",opts:["increasingly","progressively","ever more","all three work"],ans:3,exp:"'Increasingly/progressively/ever more untenable' are all natural intensifiers."},
  {q:"The lecture was so dense that much of it was ___ on the audience.",opts:["lost","wasted","missed","both A and C work"],ans:3,exp:"'Lost on' and 'missed by' both mean not understood or appreciated."},
  {q:"She ___ her disapproval with a single raised eyebrow.",opts:["conveyed","expressed","communicated","all three work"],ans:3,exp:"'Convey/express/communicate disapproval' are all natural collocations."},
  {q:"The scandal ___ serious questions about the integrity of the process.",opts:["raised","threw up","gave rise to","all three work"],ans:3,exp:"'Raise/throw up/give rise to questions' are all correct."},
  {q:"The discovery ___ our understanding of the period entirely.",opts:["overturned","revolutionised","transformed","all three work"],ans:3,exp:"'Overturn/revolutionise/transform understanding' are all natural collocations."},
  {q:"He has a ___ for arriving at exactly the wrong moment.",opts:["knack","talent","gift","habit"],ans:0,exp:"'Have a knack for' means having a particular ability or tendency — often used ironically."},
  {q:"She writes with great ___ — her sentences are always precisely calibrated.",opts:["precision","accuracy","exactness","all three work"],ans:3,exp:"'Precision/accuracy/exactness' are all valid, though 'precision' is most natural here."},
  {q:"The ___ of the evidence against him made acquittal impossible.",opts:["weight","body","preponderance","all three work"],ans:3,exp:"'Weight/body/preponderance of evidence' are all formal and correct collocations."},
  {q:"Her remarks were deliberately ___, designed to provoke a reaction.",opts:["provocative","incendiary","inflammatory","all three work"],ans:3,exp:"'Provocative/incendiary/inflammatory' all describe remarks intended to cause strong feeling."},
  {q:"The book ___ a fascinating picture of life in Victorian England.",opts:["paints","draws","portrays","all three work"],ans:3,exp:"'Paint/draw/portray a picture of' are all natural collocations."},
  {q:"His ___ handling of the situation impressed everyone.",opts:["deft","adroit","dexterous","all three work"],ans:3,exp:"'Deft/adroit/dexterous handling' all describe skilful management."},
  {q:"The legislation failed to ___ the problem it was designed to address.",opts:["tackle","address","solve","all three work"],ans:3,exp:"'Tackle/address/solve a problem' are all correct collocations."},
  {q:"She was ___ in her refusal to compromise on the key issues.",opts:["steadfast","resolute","immovable","all three work"],ans:3,exp:"'Steadfast/resolute/immovable' all describe firm determination."},
  {q:"The proposal met with ___ opposition from environmental groups.",opts:["fierce","strong","vehement","all three work"],ans:3,exp:"'Fierce/strong/vehement opposition' are all natural collocations."},
  {q:"His ___ of the subject was immediately apparent to anyone who heard him speak.",opts:["command","mastery","grasp","all three work"],ans:3,exp:"'Command/mastery/grasp of a subject' are all correct collocations."},
  {q:"She ___ no stone unturned in her search for the truth.",opts:["left","turned","kept","missed"],ans:0,exp:"'Leave no stone unturned' means to try every possible method."},
  {q:"The crisis ___ deep divisions within the government.",opts:["exposed","revealed","laid bare","all three work"],ans:3,exp:"'Expose/reveal/lay bare divisions' are all natural formal collocations."},
  {q:"He spoke with an ___ that belied his years.",opts:["authority","confidence","assurance","all three work"],ans:3,exp:"'Authority/confidence/assurance that belied his years' are all natural collocations."},
  {q:"The film is a ___ exploration of grief and memory.",opts:["profound","searching","nuanced","all three work"],ans:3,exp:"'Profound/searching/nuanced exploration' are all strong critical vocabulary choices."},
  {q:"The CEO's decision to resign came as a ___ to the board.",opts:["bombshell","shock","surprise","all three work"],ans:3,exp:"'Bombshell/shock/surprise' all describe unexpected news, though 'bombshell' is most dramatic."},
  {q:"She spoke with ___ clarity, leaving no room for misunderstanding.",opts:["crystal","stark","razor-sharp","all three work"],ans:3,exp:"'Crystal/stark/razor-sharp clarity' are all strong intensifying collocations."},
  {q:"The evidence ___ beyond doubt that the original theory was flawed.",opts:["established","demonstrated","proved","all three work"],ans:3,exp:"'Establish/demonstrate/prove beyond doubt' are all correct formal collocations."},
  {q:"His approach to the problem was ___ — no one had thought of it before.",opts:["novel","ingenious","groundbreaking","all three work"],ans:3,exp:"'Novel/ingenious/groundbreaking' all describe original, creative thinking."},
  {q:"The chairman's ___ of the proceedings was widely praised.",opts:["handling","management","conduct","all three work"],ans:3,exp:"'Handling/management/conduct of proceedings' are all natural formal collocations."},
  {q:"She has an ___ eye for detail that makes her an exceptional editor.",opts:["unerring","unfailing","infallible","all three work"],ans:3,exp:"'Unerring/unfailing/infallible eye for detail' are all strong collocations."},
  {q:"The politician's response was ___ — vague, evasive and unconvincing.",opts:["woeful","lamentable","pitiful","all three work"],ans:3,exp:"'Woeful/lamentable/pitiful' all describe something deplorably poor."},
  {q:"The manuscript, ___ as it was, showed great promise.",opts:["flawed","imperfect","rough","all three work"],ans:3,exp:"'Flawed/imperfect/rough as it was' all work in this concessive inversion structure."},
]
};

const TAG={A1:"background:#b8f0b8",A2:"background:#fffaaa",B1:"background:#ffd6a5",B2:"background:#ffb3c6",C1:"background:#c4a0f0",C2:"background:#a0d4ff"};
// Test still picks 40 questions: 7+7+8+8+5+5 — score system unchanged
const PER_LEVEL={A1:7,A2:7,B1:8,B2:8,C1:5,C2:5};
const queues={A1:[],A2:[],B1:[],B2:[],C1:[],C2:[]};
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickFromPool(lv,count){if(queues[lv].length<count){queues[lv]=shuffle([...Array(QB[lv].length).keys()]);}return queues[lv].splice(0,count);}
function buildTest(){const lvs=['A1','A2','B1','B2','C1','C2'];let t=[];lvs.forEach(lv=>{const idxs=pickFromPool(lv,PER_LEVEL[lv]);idxs.forEach(i=>t.push({...QB[lv][i],level:lv}));});return t;}
let questions=[],current=0,score=0,levelScores={},answered=false;
function init(){questions=buildTest();current=0;score=0;answered=false;levelScores={A1:0,A2:0,B1:0,B2:0,C1:0,C2:0};document.getElementById('progressWrap').style.display='none';showStart();}
function showStart(){document.getElementById('mainCard').innerHTML=`<div class="start-screen"><h2>What's your English level?</h2><p>Answer <strong>40 grammar questions</strong> across all 6 CEFR levels.</p><p>Get instant feedback on every question and a personalised result at the end!</p><div class="level-badges"><span class="badge a1">A1</span><span class="badge a2">A2</span><span class="badge b1">B1</span><span class="badge b2">B2</span><span class="badge c1">C1</span><span class="badge c2">C2</span></div><p style="font-size:0.85rem;color:#888;">⏱️ About 5 minutes &nbsp;|&nbsp; 🆓 Free &nbsp;|&nbsp; ✅ No sign-up needed</p><button class="cta-btn" onclick="startTest()">🚀 Start the Test!</button></div>`;}
function startTest(){document.getElementById('progressWrap').style.display='block';showQuestion();}
function showQuestion(){answered=false;const q=questions[current];const pct=Math.round((current/questions.length)*100)+3;document.getElementById('progressBar').style.width=pct+'%';document.getElementById('progressLabel').textContent=`Question ${current+1} of ${questions.length}`;const qText=q.q.replace('___','<span class="blank">___</span>');const optsHtml=q.opts.map((o,i)=>`<button class="option-btn" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('');document.getElementById('mainCard').innerHTML=`<div class="q-meta"><span class="q-number">Question ${current+1} / ${questions.length}</span><span class="q-level-tag" style="${TAG[q.level]}">${q.level}</span></div><div class="question-text">${qText}</div><div class="options">${optsHtml}</div><div class="feedback-box" id="feedbackBox"></div><button class="next-btn" id="nextBtn" onclick="nextQuestion()">${current===questions.length-1?'📊 See My Results!':'Next Question →'}</button>`;}
function answer(idx){if(answered)return;answered=true;const q=questions[current];const btns=document.querySelectorAll('.option-btn');btns.forEach(b=>b.disabled=true);const fb=document.getElementById('feedbackBox');if(idx===q.ans){score++;levelScores[q.level]++;btns[idx].classList.add('correct');fb.className='feedback-box show correct-fb';fb.innerHTML='✅ Correct! '+q.exp;}else{btns[idx].classList.add('wrong');btns[q.ans].classList.add('reveal');fb.className='feedback-box show wrong-fb';fb.innerHTML='❌ Not quite. '+q.exp;}document.getElementById('nextBtn').classList.add('show');}
function nextQuestion(){current++;if(current>=questions.length)showResults();else showQuestion();}
function showResults(){document.getElementById('progressBar').style.width='100%';document.getElementById('progressLabel').textContent='Complete!';const lvOrder=['A1','A2','B1','B2','C1','C2'];let resultLevel='A1';let nextFailed=null;for(let i=0;i<lvOrder.length;i++){const lv=lvOrder[i];const passed=levelScores[lv]>=Math.ceil(PER_LEVEL[lv]*0.5);if(passed){resultLevel=lv;}else{if(levelScores[lv]>0&&i>0)nextFailed=lv;break;}}const displayLevel=nextFailed?resultLevel+' / Low '+nextFailed:resultLevel;const pct=Math.round((score/questions.length)*100);const lvInfo={A1:{emoji:'🌱',name:'Beginner',desc:'You are at the very start of your English learning journey! You can understand and use familiar everyday expressions and basic phrases. Keep building your foundations.',guide:'Focus on basic grammar (present simple, articles, pronouns), everyday vocabulary and short sentences.'},A2:{emoji:'📗',name:'Elementary',desc:'You can communicate in simple and routine tasks on familiar topics. You are making great progress with basic grammar structures like past simple, comparatives and simple questions.',guide:'Work on past tenses, comparatives, question forms and expanding vocabulary for daily situations.'},B1:{emoji:'📘',name:'Intermediate',desc:'You can deal with most situations likely to arise when travelling in an English-speaking area. You can produce simple connected text and describe experiences and events.',guide:'Practise conditionals, passive voice, reported speech, perfect tenses and a wider range of vocabulary.'},B2:{emoji:'📙',name:'Upper Intermediate',desc:'You can understand the main ideas of complex text on both concrete and abstract topics. You can interact with native speakers with a degree of fluency and spontaneity.',guide:'Focus on advanced grammar (inversions, mixed conditionals, complex sentence structures) and idiomatic expressions.'},C1:{emoji:'🏆',name:'Advanced',desc:'You can express yourself fluently and spontaneously. You can use language flexibly and effectively for social, academic and professional purposes with only rare imprecision.',guide:'Work on nuanced grammar (subjunctive, complex passives), sophisticated vocabulary and academic writing style.'},C2:{emoji:'🌟',name:'Proficiency',desc:'You can understand virtually everything heard or read with ease. You can express yourself spontaneously, very fluently and precisely, differentiating finer shades of meaning in complex situations.',guide:'Near-native fluency! Explore literary texts, advanced collocations and subtle register differences.'}};const info=lvInfo[resultLevel];const breakdownHtml=lvOrder.map(lv=>`<div class="breakdown-cell"><div class="blabel">${lv}</div><div class="bval">${levelScores[lv]}/${PER_LEVEL[lv]}</div></div>`).join('');document.getElementById('mainCard').innerHTML=`<div class="results-screen"><p style="font-family:'Fredoka One',cursive;font-size:1.1rem;color:#888;">Your level is...</p><div class="result-level">${info.emoji} ${displayLevel}</div><div class="result-name">${info.name}</div><div class="score-pill">⭐ Score: ${score} / ${questions.length} (${pct}%)</div><div class="result-desc">${info.desc}</div><div class="guide-rec"><h3>📚 What to study next:</h3><p>${info.guide}</p></div><p style="font-family:'Fredoka One',cursive;font-size:1rem;color:#888;margin-bottom:8px;">Score breakdown by level:</p><div class="breakdown">${breakdownHtml}</div><button class="cta-btn" onclick="window.open('https://therevisionstation.com','_blank')">🦉 Visit The Revision Station</button><br><button class="retry-btn" onclick="init()">🔄 Take the test again</button></div>`;}
init();
</script>
